<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>页面无法访问</title>
    <style>
        :root {
            color-scheme: light dark;
            --background: #f7faff;
            --surface: rgba(255, 255, 255, 0.76);
            --text: #182230;
            --muted: #7b8798;
            --accent: #2196f3;
            --accent-light: #7cc4ff;
            --line: rgba(33, 150, 243, 0.14);
            --shadow: rgba(35, 110, 180, 0.14);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at 15% 15%, rgba(33, 150, 243, 0.12), transparent 30%),
                radial-gradient(circle at 85% 85%, rgba(124, 196, 255, 0.15), transparent 28%),
                var(--background);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                "Microsoft YaHei", sans-serif;
        }

        main {
            min-height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 28px;
            text-align: center;
        }

        section {
            position: relative;
            width: 100%;
            max-width: 360px;
            padding: 48px 28px 44px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 32px;
            background: var(--surface);
            box-shadow: 0 24px 64px var(--shadow);
            transform: translateY(-5vh);
            -webkit-backdrop-filter: blur(16px);
            backdrop-filter: blur(16px);
        }

        section::before {
            content: "";
            position: absolute;
            width: 210px;
            height: 210px;
            top: -132px;
            left: 50%;
            border: 1px solid var(--line);
            border-radius: 50%;
            box-shadow:
                0 0 0 28px rgba(33, 150, 243, 0.035),
                0 0 0 58px rgba(33, 150, 243, 0.025);
            transform: translateX(-50%);
        }

        .error-code {
            position: relative;
            display: inline-block;
            margin: 0 0 22px;
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            -webkit-background-clip: text;
            background-clip: text;
            color: var(--accent);
            font-size: clamp(82px, 25vw, 112px);
            font-weight: 800;
            line-height: 0.9;
            letter-spacing: -7px;
            text-shadow: 0 14px 32px var(--shadow);
            -webkit-text-fill-color: transparent;
        }

        h1 {
            margin: 0;
            font-size: 22px;
            font-weight: 600;
            letter-spacing: 0.02em;
        }

        .description {
            margin: 12px 0 0;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.75;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --background: #171a1f;
                --surface: rgba(36, 41, 48, 0.82);
                --text: #f2f5f8;
                --muted: #a4adba;
                --accent: #64b5f6;
                --accent-light: #a4d7ff;
                --line: rgba(100, 181, 246, 0.18);
                --shadow: rgba(0, 0, 0, 0.28);
            }

            section {
                border-color: rgba(255, 255, 255, 0.06);
            }
        }
    </style>
</head>
<body>
    <main>
        <section aria-labelledby="error-title">
            <div class="error-code" aria-hidden="true">404</div>
            <h1 id="error-title">页面走丢了</h1>
            <p class="description">请检查网络连接后再试</p>
        </section>
    </main>
</body>
</html>
